# MyPhone 自建 TURN 服务器配置模板
# 实际文件由 install-deps.sh 生成到 /etc/turnserver.conf（含随机密码）。

# 监听端口（阿里云安全组需放行 3478/tcp + 3478/udp）
listening-port=3478

# 强制接收方校验（部分客户端依赖）
fingerprint

# 长期凭据机制（静态账号密码）
lt-cred-mech
# 用户行由 install-deps.sh 生成，形如：
# user=myphone:<随机密码>
# 与打包 APK 时的 MYPHONE_TURN_USERNAME / MYPHONE_TURN_CREDENTIAL 保持一致
realm=myphone

# 配额与安全（防滥用：总量、带宽、禁止组播对端）
total-quota=100
max-bps=1000000
no-multicast-peers
stale-nonce
no-cli

# ★关键：server-relay 启用服务器中继模式，取消 relay 端点间的 IP 权限检查。
#   没有它，两个 TURN 客户端(relay→relay)的媒体数据不转发，跨网络通话无法接通。
#   这是 GitHub 成功实践(flutter-webrtc issue #1423/#1614)验证过的修复。
server-relay

# ★允许回环/本机 peer + 明确允许私有段。
#   否则真机/模拟器的 host 候选(10.x/172.16-31/192.168/100.64)做 CreatePermission 会被 403。
allow-loopback-peers
allowed-peer-ip=10.0.0.0-10.255.255.255
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=100.64.0.0-100.127.255.255

# 中继端口范围（阿里云安全组需放行 49152-65535/udp）
min-port=49152
max-port=65535

# 公网 IP（由 install-deps.sh 探测后追加）：
# external-ip=<公网IP>
# 若在 NAT 内网转发场景，务必显式填写 公网IP/内网IP 形式。

log-file=/var/log/turnserver.log
