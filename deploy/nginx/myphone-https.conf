# MyPhone 反向代理 —— HTTPS 版（拿到域名并签发证书后使用）
# 部署步骤见部署手册「HTTPS 升级」章节。
# 使用前把 server_name / 证书路径替换为真实域名。
#
# 启用方式：
#   1) certbot --nginx -d myphone.example.com（自动改本配置为 443 + 证书）
#   2) 重打生产 APK：MYPHONE_SERVER_PORT=443, MYPHONE_SERVER_TLS=true

limit_req_zone $binary_remote_addr zone=myphone_login:10m rate=10r/m;

server {
    listen 443 ssl;                    # nginx ≥1.25.1 可加 http2 on; 启用 HTTP/2
    server_name myphone.example.com;   # ← 改为你的域名

    ssl_certificate     /etc/letsencrypt/live/myphone.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myphone.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 管理后台：Basic Auth 保护
    location ~ ^/admin(/|$) {
        auth_basic "MyPhone Admin";
        auth_basic_user_file /etc/nginx/.myphone-htpasswd;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录接口限速
    location = /v1/auth/login {
        limit_req zone=myphone_login burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余：REST API + WebSocket 信令
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（/ws）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# HTTP 80：只用于 ACME 证书签发，其余跳转 HTTPS
server {
    listen 80;
    server_name myphone.example.com;   # ← 改为你的域名

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
