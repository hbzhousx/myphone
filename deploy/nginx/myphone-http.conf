# MyPhone 反向代理 —— HTTP 版（临时无域名方案）
# 由 deploy-server.sh 安装到 /etc/nginx/conf.d/myphone.conf
# 后端 Go 服务只监听 127.0.0.1:8080，外部统一走本配置。
#
# 拿到域名启用 HTTPS 后，替换为 myphone-https.conf。

# 登录接口限速（防爆破；同一出口 IP 共享，阈值取宽松值）
limit_req_zone $binary_remote_addr zone=myphone_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # 管理后台：Basic Auth 保护
    location ~ ^/admin(/|$) {
        auth_basic "MyPhone Admin";
        auth_basic_user_file /etc/nginx/.myphone-htpasswd;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录接口限速
    location = /v1/auth/login {
        limit_req zone=myphone_login burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余：REST API + WebSocket 信令
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（/ws）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
