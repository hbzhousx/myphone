name: myphone
description: Encrypted calling app with low-bandwidth support.
publish_to: 'none'
version: 1.4.1+106

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_webrtc: ^0.10.4
  local_auth: ^2.1.8
  flutter_ringtone_player: ^4.0.0+4
  audioplayers: ^6.0.0
  package_info_plus: ^8.0.0
  flutter_secure_storage: ^9.0.0
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  uuid: ^4.2.2
  logging: ^1.2.0
  path_provider: ^2.1.1
  path: ^1.9.0
  sqflite: ^2.3.2
  crypto: ^3.0.3
  convert: ^3.1.1
  cryptography: ^2.7.0
  permission_handler: ^11.2.0
  wakelock_plus: ^1.2.8
  sqflite_sqlcipher:
    path: third_party/sqflite_sqlcipher
  sqlcipher_flutter_libs: ^0.6.8
  file_picker: ^8.0.7
  image_picker: ^1.1.2
  mime: ^2.0.0
  geolocator: ^10.1.0
  url_launcher: ^6.3.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/sounds/dtmf/
